spring:
  application:
    name: ms-consult-test
  
  # 使用 H2 内存数据库测试
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    
  # 禁用 Redis
  data:
    redis:
      host: localhost
      port: 6379

  # 关闭 JPA 初始化
  jpa:
    defer-datasource-initialization: false
    show-sql: false

server:
  port: 18081

# 禁用 Nacos
spring.cloud.nacos.discovery.enabled: false

# 日志级别
logging:
  level:
    root: WARN
    com.xiaoli.legal: INFO
