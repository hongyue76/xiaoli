server:
  port: 18081

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ms-consult

  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        service: ${spring.application.name}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:xiaoli-legal}

  # PostgreSQL 数据库配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:xiaoli_legal}
    username: ${DB_USERNAME:xiaoli}
    password: ${DB_PASSWORD:Xiaoli@2024}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      connection-test-query: SELECT 1

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xiaoli.legal.ms.consult.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    local-cache-scope: session
    jdbc-type-for-null: null
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AI服务配置
xiaoli:
  api:
    base-url: ${XIAOLI_API_BASE_URL:https://api.xiaoli.ai}
    key: ${XIAOLI_API_KEY:your-api-key}
    model: ${XIAOLI_API_MODEL:xiaoli-legal}
    timeout: 30000

# DeepSeek AI配置
deepseek:
  api:
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1}
    key: ${DEEPSEEK_API_KEY:sk-ab6f6d5baa9349c6a735df32f9cc4f16}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout: ${DEEPSEEK_TIMEOUT:60}

# 得理法搜API配置
delilegal:
  base-url: ${DELILEGAL_BASE_URL:https://openapi.delilegal.com}
  app-id: ${DELILEGAL_APP_ID:QthdBErlyaYvyXul}
  secret: ${DELILEGAL_SECRET:EC5D455E6BD348CE8E18BE05926D2EBE}
  timeout: 30000

# 腾讯元器智能体配置
tencent:
  yuanqi:
    base-url: ${TENCENT_YUANQI_BASE_URL:https://api.yuanqi.tencent.com}
    assistant-id: ${TENCENT_YUANQI_ASSISTANT_ID:your-assistant-id}
    token: ${TENCENT_YUANQI_TOKEN:your-token}
    timeout: 60000

# 案例检索服务配置
case:
  search:
    enabled: true
    base-url: http://${CASE_HOST:localhost}:${CASE_PORT:8083}
    timeout: 10000
    default-limit: 3

# 日志配置
logging:
  level:
    root: WARN
    com.xiaoli.legal: INFO
    com.xiaoli.legal.mapper: DEBUG
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: logs/${spring.application.name}.log
    max-size: 100MB
    max-history: 30
