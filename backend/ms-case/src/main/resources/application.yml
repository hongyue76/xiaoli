server:
  port: 18083

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ms-case

  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        service: ${spring.application.name}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:xiaoli-legal}

  # PostgreSQL
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:xiaoli_legal}
    username: ${DB_USERNAME:xiaoli}
    password: ${DB_PASSWORD:Xiaoli@2024}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      connection-test-query: SELECT 1

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # Elasticsearch (注释掉以支持本地开发)
  # elasticsearch:
  #   uris: http://localhost:9200

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xiaoli.legal.ms.caseinfo.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    local-cache-scope: session
    jdbc-type-for-null: null

# Milvus 向量数据库
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: legal_cases
  dimension: 1536

# 腾讯元器智能体
tencent:
  yuanqi:
    base-url: ${TENCENT_YUANQI_BASE_URL:}
    assistant-id: ${TENCENT_YUANQI_ASSISTANT_ID:}
    token: ${TENCENT_YUANQI_TOKEN:}
    timeout: 60000

# 得理法搜案例检索API（必须配置环境变量）
delilegal:
  base-url: ${DELILEGAL_BASE_URL:https://openapi.delilegal.com}
  app-id: ${DELILEGAL_APP_ID:}
  secret: ${DELILEGAL_SECRET:}
  api-key: ${DELILEGAL_API_KEY:}
  timeout: 30000

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: false
  health:
    db:
      enabled: true
    redis:
      enabled: true
    elasticsearch:
      enabled: false

logging:
  level:
    root: WARN
    com.xiaoli.legal: INFO
    com.xiaoli.legal.mapper: DEBUG
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: ../logs/${spring.application.name}.log
    max-size: 100MB
    max-history: 30
