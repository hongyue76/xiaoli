# 意图路由核心模块配置
server.port=8087
server.servlet.context-path=/intent-router

# DeepSeek API 配置
deepseek.api.key=${DEEPSEEK_API_KEY:sk-c5892df7738d4d8194e6fa775dc1810f}
deepseek.api.base-url=https://api.deepseek.com/v1
deepseek.api.model=deepseek-chat
deepseek.api.timeout=30000
deepseek.api.max-retries=3

# 意图识别配置
intent.confidence-threshold=0.6
intent.enable-fallback=true
intent.fallback-intent=GENERAL

# 得理法搜 API 配置
delilegal.api.enabled=true
delilegal.api.base-url=${DELILEGAL_API_BASE_URL:https://api.delilegal.com}

# 日志配置
logging.level.com.xiaoli.intent=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
