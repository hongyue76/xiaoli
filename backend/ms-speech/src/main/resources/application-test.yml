# 测试环境配置
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:192.168.1.100}:${NACOS_PORT:8848}
        namespace: test
  datasource:
    url: jdbc:postgresql://${DB_HOST:192.168.1.100}:${DB_PORT:5432}/${DB_NAME:test_xiaoli_legal}
    username: ${DB_USERNAME:test_xiaoli}
