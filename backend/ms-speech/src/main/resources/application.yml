server:
  port: 18089
  
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ms-speech
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        service: ${spring.application.name}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:xiaoli-legal}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:xiaoli_legal}
    username: ${DB_USERNAME:xiaoli}
    password: ${DB_PASSWORD:Xiaoli@2024}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      connection-test-query: SELECT 1

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 语音服务配置
speech:
  asr:
    # 腾讯云ASR配置
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    app-id: ${TENCENT_APP_ID:}
    # 支持的模型类型: 8k_zh, 16k_zh
    model-type: 16k_zh
    # 支持的语言: zh-CN
    language: zh-CN
  tts:
    # 腾讯云TTS配置
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    app-id: ${TENCENT_APP_ID:}
    # 音色: 0-亲和女声, 1-亲和男声, 2-成熟男声, 3-活力男声, 4-温暖女声
    voice-type: 0
    # 语速: 0.5-2.0
    speed: 1.0
    # 音量: 0-10
    volume: 5

tencent:
  yuanqi:
    base-url: ${TENCENT_YUANQI_BASE_URL:}
    assistant-id: ${TENCENT_YUANQI_ASSISTANT_ID:}
    token: ${TENCENT_YUANQI_TOKEN:}
    timeout: 60000

xiaoli:
  api:
    base-url: ${TENCENT_YUANQI_BASE_URL:}
    api-key: ${TENCENT_YUANQI_TOKEN:}
    model: ${TENCENT_YUANQI_MODEL:}

# WebSocket配置
websocket:
  allowed-origins: "*"
  max-text-message-size: 10240000
  max-binary-message-size: 10240000

logging:
  level:
    root: WARN
    com.xiaoli.legal: INFO
    com.xiaoli.legal.mapper: DEBUG
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: ../logs/${spring.application.name}.log
    max-size: 100MB
    max-history: 30
