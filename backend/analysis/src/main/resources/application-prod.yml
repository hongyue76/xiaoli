# 生产环境配置
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:prod-nacos.example.com}:${NACOS_PORT:8848}
        namespace: prod
        group: xiaoli-legal-prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50

logging:
  level:
    root: WARN
    com.xiaoli.legal: WARN
    org.springframework: ERROR

springdoc:
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always