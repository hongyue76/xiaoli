user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 上游服务器
    upstream backend_consult {
        server ms-consult:8081;
        keepalive 32;
    }
    
    upstream backend_document {
        server ms-document:8082;
        keepalive 32;
    }
    
    upstream backend_case {
        server ms-caseinfo:8083;
        keepalive 32;
    }
    
    upstream backend_contract {
        server ms-contract:8084;
        keepalive 32;
    }
    
    upstream backend_analysis {
        server analysis:8085;
        keepalive 32;
    }
    
    upstream backend_decision {
        server ms-decision:8086;
        keepalive 32;
    }

    upstream backend_compliance {
        server ms-compliance:8087;
        keepalive 32;
    }
    
    upstream backend_evidence {
        server ms-evidence:8088;
        keepalive 32;
    }
    
    upstream backend_speech {
        server ms-speech:8089;
        keepalive 32;
    }

    # 静态文件服务
    server {
        listen 80;
        server_name localhost;
        
        root /usr/share/nginx/html;
        index index.html;

        # 前端静态资源
        location / {
            try_files $uri $uri/ /index.html;
            
            # 缓存配置
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }

        # API代理 - 法律咨询
        location /api/consult/ {
            proxy_pass http://backend_consult;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # API代理 - 文书生成
        location /api/document/ {
            proxy_pass http://backend_document;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API代理 - 案例检索
        location /api/case/ {
            proxy_pass http://backend_case;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API代理 - 合同审查
        location /api/contract/ {
            proxy_pass http://backend_contract;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API代理 - 案件分析
        location /api/analysis/ {
            proxy_pass http://backend_analysis;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API代理 - 司法决策
        location /api/decision/ {
            proxy_pass http://backend_decision;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API代理 - 企业合规
        location /api/compliance/ {
            proxy_pass http://backend_compliance;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API代理 - 证据分析
        location /api/evidence/ {
            proxy_pass http://backend_evidence;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API代理 - 语音服务
        location /api/speech/ {
            proxy_pass http://backend_speech;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # WebSocket支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # WebSocket代理
        location /ws/ {
            proxy_pass http://backend_speech;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
