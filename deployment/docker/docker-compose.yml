    networks:
      - xiaoli-net

  ms-evidence:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
      args:
        SERVICE_NAME: ms-evidence
        SERVICE_PORT: 8088
    container_name: xiaoli-ms-evidence
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: xiaoli_legal
      DB_USERNAME: xiaoli
      DB_PASSWORD: ${DB_PASSWORD:-Xiaoli@2024}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xiaoli-net

  ms-speech:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
      args:
        SERVICE_NAME: ms-speech
        SERVICE_PORT: 8089
    container_name: xiaoli-ms-speech
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: xiaoli_legal
      DB_USERNAME: xiaoli
      DB_PASSWORD: ${DB_PASSWORD:-Xiaoli@2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Xiaoli@2024}
      XIAOLI_API_KEY: ${XIAOLI_API_KEY:-your-api-key}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_APP_ID: ${TENCENT_APP_ID:-}
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xiaoli-net

  # ==================== 前端 ====================
  
  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: xiaoli-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - ms-consult
    networks:
      - xiaoli-net

networks:
  xiaoli-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
