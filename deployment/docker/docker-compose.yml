        SERVICE_NAME: analysis
        SERVICE_PORT: 8085
    container_name: xiaoli-analysis
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: xiaoli_legal
      DB_USERNAME: xiaoli
      DB_PASSWORD: ${DB_PASSWORD:-Xiaoli@2024}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xiaoli-net

  ms-decision:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
      args:
        SERVICE_NAME: ms-decision
        SERVICE_PORT: 8086
    container_name: xiaoli-ms-decision
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: xiaoli_legal
      DB_USERNAME: xiaoli
      DB_PASSWORD: ${DB_PASSWORD:-Xiaoli@2024}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xiaoli-net

  ms-compliance:
    build:
      context: ../..
