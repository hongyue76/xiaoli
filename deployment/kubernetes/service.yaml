apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: xiaoli-legal
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: xiaoli-legal
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: xiaoli-frontend
  namespace: xiaoli-legal
spec:
  selector:
    app: xiaoli
    tier: frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
